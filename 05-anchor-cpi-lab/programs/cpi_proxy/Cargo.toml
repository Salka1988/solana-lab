[package]
name = "cpi_proxy"
version = "0.1.0"
description = "CPI caller proxy program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cpi_proxy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "cpi_counter/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.2"
cpi_counter = { path = "../cpi_counter", features = ["cpi"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
