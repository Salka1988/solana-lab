[package]
name = "stablecoin_bridge_receiver"
version = "0.1.0"
description = "Token-2022 stablecoin bridge message receiver"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stablecoin_bridge_receiver"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }

[dev-dependencies]
anchor-lang = { workspace = true }
litesvm = { workspace = true }
solana-keypair = { workspace = true }
solana_m0_test_support = { workspace = true }
solana-signer = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
