[workspace]
members = ["programs/*", "crates/*"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", features = ["token_2022", "token_2022_extensions"] }
litesvm = "0.10.0"
solana-keypair = "3.0.1"
solana_m0_test_support = { path = "../test-support" }
solana-signer = "3.0.0"
proptest = "1.9.0"
spl-discriminator = "0.4.0"
spl-tlv-account-resolution = "0.9.0"
spl-token-metadata-interface = "0.8.0"
spl-transfer-hook-interface = "0.9.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
