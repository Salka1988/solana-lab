[package]
name = "mock_bridge_receiver"
version = "0.1.0"
description = "Mock bridge receiver with replay protection"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_bridge_receiver"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }

[dev-dependencies]
anchor-lang = { workspace = true }
litesvm = "0.10.0"
solana-keypair = "3.0.1"
solana-signer = "3.0.0"
solana_m0_test_support = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
