[package]
name = "modular_issuer"
version = "0.1.0"
description = "Stablecoin issuance core program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "modular_issuer"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.2"
anchor-spl = { version = "1.0.2", features = ["token_2022", "token_2022_extensions"] }
spl-token-metadata-interface = "0.8.0"

[dev-dependencies]
litesvm = "0.10.0"
solana_m0_test_support = { path = "../../../test-support" }
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
