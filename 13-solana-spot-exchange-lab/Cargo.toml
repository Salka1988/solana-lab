[workspace]
members = ["crates/*", "programs/*", "services/*"]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["token_2022"] }
application = { path = "crates/application" }
axum = "0.8.4"
domain = { path = "crates/domain" }
litesvm = { version = "0.10.0", features = ["precompiles"] }
runtime = { path = "crates/runtime" }
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10.9"
solana-account = "3.1.0"
solana-ed25519-program = "3.0.0"
solana-instructions-sysvar = "3.0.1"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.0"
solana-transaction = "3.0.1"
solana_m0_test_support = { path = "../test-support" }
sqlx = "0.8.6"
tokio = "1.46.1"
tower = "0.5.2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
