[workspace]
members = ["crates/*", "services/*"]
resolver = "2"

[workspace.dependencies]
application = { path = "crates/application" }
axum = "0.8.4"
domain = { path = "crates/domain" }
runtime = { path = "crates/runtime" }
serde = "1.0.228"
serde_json = "1.0.145"
tokio = "1.46.1"
tower = "0.5.2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
