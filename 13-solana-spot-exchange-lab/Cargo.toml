[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
application = { path = "crates/application" }
domain = { path = "crates/domain" }
tokio = "1.46.1"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
