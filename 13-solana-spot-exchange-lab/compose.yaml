services:
  exchange-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EXCHANGE_HTTP_ADDR: 0.0.0.0:3000
      EXCHANGE_BOOT_MODE: postgres
      DATABASE_URL: postgres://exchange:exchange@postgres:5432/exchange
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange -d exchange"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - exchange-postgres-data:/var/lib/postgresql/data

volumes:
  exchange-postgres-data:
